<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life journey video — fp-timeline</title>
<!-- Separate files rather than one sheet, and plain <link> rather than @import:
     @import serialises the requests, several links load in parallel. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<!-- ============================================================ top bar ===
     Fixed, and it holds only NAVIGATION plus the few things that must be
     reachable from every screen. Every tuning control lives in the left panel,
     which is what buys that panel enough room to be readable. -->
<header id="topbar">
  <button id="sideToggle" class="hamb" title="Show or hide the settings panel"
          aria-label="Toggle settings panel">☰</button>
  <h1>Life journey video</h1>
  <nav id="steps">
    <button data-step="1" class="on">Person</button>
    <button data-step="5" disabled>Video</button>
    <!-- These appear ONLY in expert mode, via body.expert in CSS. The default
         path is: pick a person -> get a video, with nothing to configure. -->
    <button data-step="2" class="adv" disabled>Photos</button>
    <button data-step="3" class="adv" disabled>Thresholds</button>
    <button data-step="4" class="adv" disabled>Render</button>
    <!-- No data-step, so step() skips them: always clickable, and they never
         take part in the progressive unlocking. -->
    <button id="navMusic" class="aside">Music</button>
    <button id="navStats" class="aside">Statistics</button>
  </nav>
  <label class="expertToggle" title="Reopen the per-stage tuning steps">
    <input type="checkbox" id="expert"> Expert
  </label>
</header>

<!-- Scrim behind the drawer on narrow screens: tapping outside closes it. -->
<div id="scrim"></div>

<div id="shell">

  <!-- ========================================================= left panel ===
       One persistent panel of collapsible groups instead of a different sidebar
       per step. Two reasons it is better here: the controls stop moving around
       between screens, and readFilterUI()/renderOpts() can read them from any
       screen because they are always in the DOM. -->
  <aside id="side" class="adv">
    <div id="sideHead">
      <span id="sideCtx" class="muted"></span>
    </div>
    <div id="sideBody"></div>
    <div id="sideFoot">
      <button id="apply" class="primary">Apply</button>
      <button id="resetF">Defaults</button>
      <button id="render" class="primary">Render</button>
      <div id="applying" class="muted"></div>
      <p class="muted" id="renderEst"></p>
    </div>
  </aside>

  <main id="view">
    <div id="health" class="muted"></div>
    <div id="screens"></div>
  </main>

</div>

<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
