# Build hai image roi day len GHCR, de may dich chi viec pull.
#
# Vi sao lam o day thay vi build tren may dich: may dich la OptiPlex 3010,
# 4 core, mang WiFi hay Read timeout giua khi pip tai wheel. Rieng insightface
# phai compile tu source (khong co wheel) nen build tai cho mat 15-20 phut va
# hay that bai. Runner cua GitHub lam viec do trong vai phut.
#
# Ket qua:
#   ghcr.io/sinhsac/immich-life-timeline/fp-indexer:latest
#   ghcr.io/sinhsac/immich-life-timeline/fp-timeline:latest
# kem tag theo commit sha va theo git tag.

name: build images

on:
  push:
    branches: [main]
    # Tag v* de tao release. Khong dat 'paths' o day: mot key 'push' chi co mot
    # bo filter, va path filter ap dung nham vao tag push se lam release im lang
    # khong build gi. Build lai khi chi sua doc thi hoi thua, nhung cache gha
    # lam no chi mat 1-2 phut — doi lay viec tag luon chay dung.
    tags: ["v*"]
  # Cho phep bam chay tay tu tab Actions
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # can de push len GHCR bang GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # timeline that bai thi indexer van build tiep
      matrix:
        include:
          - name: fp-indexer
            dir: indexer
          - name: fp-timeline
            dir: timeline

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN co san, khong phai tao secret gi
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/deploy/Dockerfile
          # May dich la x86_64. Khong build arm de khoi phai chay QEMU (rat cham).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache rieng theo tung image, neu khong hai job se dap cache cua nhau.
          # Nho cache nay ma lan build sau khong phai compile lai insightface.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: tom tat
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Chi chay khi push tag v*. Tao GitHub Release sau khi CA HAI image build xong,
  # de release khong bao gio tro toi image chua ton tai.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # can de tao release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # can full history de --generate-notes so sanh duoc

      - name: tao release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMG: ghcr.io/${{ github.repository }}
        run: |
          V=${TAG#v}
          cat > /tmp/notes.md <<EOF
          ## Image

          \`\`\`
          $IMG/fp-indexer:$V
          $IMG/fp-timeline:$V
          \`\`\`

          Hoac dung \`$TAG\`, \`latest\`, hay \`sha-${GITHUB_SHA}\` de ghim chinh xac.

          ## Chay nhanh

          \`\`\`bash
          git clone --branch $TAG https://github.com/${GITHUB_REPOSITORY}.git
          cd $(basename ${GITHUB_REPOSITORY})
          cp .env.example .env      # sua PG_PASSWORD va UPLOAD_LOCATION
          docker compose --profile setup up     # tai model, mot lan
          docker compose run --rm indexer       # quet thu vien
          docker compose up -d timeline         # http://localhost:8080
          \`\`\`

          Yeu cau: Immich da chay xong Facial Recognition, va truy cap duoc
          Postgres cua Immich. Khong can GPU.

          ## Tai lieu

          - [README](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG/README.md)
          - [indexer](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG/indexer/README.md)
          - [timeline](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG/timeline/README.md)
          - [Toan bo commit](https://github.com/${GITHUB_REPOSITORY}/commits/$TAG)

          Giay phep: PolyForm Noncommercial 1.0.0 — mien phi phi thuong mai.
          EOF
          # Khong dung --generate-notes cung luc voi --notes-file: mot so ban gh
          # coi hai co nay la xung dot va lam buoc nay that bai.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag
